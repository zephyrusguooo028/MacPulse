name: Windows build

on:
  push:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: windows/Peekaboo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish single-file exe
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o out

      - name: Self-test (readers, scanners, cleanup round trip)
        run: |
          $p = Start-Process -FilePath .\out\Peekaboo.exe -ArgumentList "--selftest", "$PWD\selftest.txt" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "self-test timed out" }
          Get-Content selftest.txt
          if (-not (Select-String -Path selftest.txt -Pattern '^OK$' -Quiet)) { throw "self-test failed" }

      - name: Icon sheet
        run: |
          $p = Start-Process -FilePath .\out\Peekaboo.exe -ArgumentList "--icon-sheet", "$PWD\icons.png" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "icon sheet timed out" }

      - name: Page screenshots
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $p = Start-Process -FilePath .\out\Peekaboo.exe -ArgumentList "--snapshot", "$PWD\shots" -PassThru
          if (-not $p.WaitForExit(600000)) { $p.Kill(); throw "snapshot timed out" }
          Get-ChildItem shots
          $err = Join-Path $env:LOCALAPPDATA "Peekaboo\errors.log"
          if (Test-Path $err) { Get-Content $err; throw "unhandled UI errors" }

      - uses: actions/upload-artifact@v4
        with:
          name: Peekaboo-win-x64
          path: windows/Peekaboo/out/Peekaboo.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            windows/Peekaboo/selftest.txt
            windows/Peekaboo/icons.png
            windows/Peekaboo/shots/
